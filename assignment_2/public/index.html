<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather & Currency Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <!-- Using Google Fonts for a premium look -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <h1>Dashboard</h1>

        <!-- Weather Section -->
        <section class="card weather-card">
            <h2>Weather</h2>
            <div class="input-group">
                <input type="text" id="cityInput" placeholder="Enter city name..." />
                <button id="getWeatherBtn">Get Weather</button>
            </div>
            <div id="weatherResult" class="result hidden">
                <div class="weather-main">
                    <div class="temp" id="displayTemp">--°C</div>
                    <div class="desc" id="displayDesc">--</div>
                </div>
                <div class="weather-details">
                    <p><strong>Feels Like:</strong> <span id="displayFeels">--</span>°C</p>
                    <p><strong>Humidity:</strong> <span id="displayHumidity">--</span>%</p>
                    <!-- API didn't ask for humidity but usually good, wait, requirement was Rain vol. Adjusting JS later -->
                    <p><strong>Wind:</strong> <span id="displayWind">--</span> m/s</p>
                    <p><strong>Rain (3h):</strong> <span id="displayRain">--</span> mm</p>
                    <p><strong>Coords:</strong> <span id="displayCoords">--</span></p>
                    <p><strong>Country:</strong> <span id="displayCountry">--</span></p>
                </div>
            </div>
            <div id="weatherError" class="error hidden"></div>
        </section>

        <!-- Currency Section -->
        <section class="card currency-card">
            <h2>Currency Converter</h2>
            <div class="input-group">
                <input type="number" id="amountInput" placeholder="Amount" value="1" />
                <select id="fromCurrency">
                    <option value="USD">USD</option>
                    <option value="EUR">EUR</option>
                    <option value="GBP">GBP</option>
                    <option value="KZT">KZT</option>
                    <option value="RUB">RUB</option>
                </select>
                <span>to</span>
                <select id="toCurrency">
                    <option value="KZT">KZT</option>
                    <option value="USD">USD</option>
                    <option value="EUR">EUR</option>
                    <option value="GBP">GBP</option>
                    <option value="RUB">RUB</option>
                </select>
                <button id="convertBtn">Convert</button>
            </div>
            <div id="currencyResult" class="result hidden">
                <p class="conversion-text"><span id="displayAmount">--</span> <span id="displayBase">--</span> =</p>
                <p class="conversion-result"><span id="displayResult">--</span> <span id="displayTarget">--</span></p>
                <p class="rate-info">Rate: 1 <span id="displayRateBase">--</span> = <span id="displayRate">--</span>
                    <span id="displayRateTarget">--</span>
                </p>
            </div>
            <div id="currencyError" class="error hidden"></div>
        </section>

        <!-- Cat Section -->
        <section class="card cat-card">
            <h2>Random Cat Image</h2>
            <div class="input-group">
                <button id="getCatBtn">Get Random Cat Image</button>
            </div>
            <div id="catResult" class="result hidden">
                <img id="catImage" src="" alt="Random Cat"
                    style="width: 100%; border-radius: 8px; margin-top: 10px; max-height: 400px; object-fit: cover;">
            </div>
            <div id="catError" class="error hidden"></div>
        </section>

        <!-- Footer / Map Placeholder -->
        <footer>
            <p>Assignment 2 - Backend Integration</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>

</html>
